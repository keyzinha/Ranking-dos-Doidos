    :root {

      --bg-main: #020617;

      --border-color: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --accent-muted: rgba(16, 185, 129, 0.1);
      --accent-glow: rgba(16, 185, 129, 0.4);
    }
    
    /* Mapeamento de Classes Dinâmicas do Tema Ativo */
    .theme-bg-main { background-color: var(--bg-main) !important; }
    .theme-bg-card { background-color: var(--bg-card) !important; }
    .theme-bg-sidebar { background-color: var(--bg-sidebar) !important; }
    .theme-bg-input { background-color: var(--bg-input) !important; }

    .theme-text-main { color: var(--text-main) !important; }
    .theme-text-muted { color: var(--text-muted) !important; }
    .theme-border { border-color: var(--border-color) !important; }
    
    /* Destaques e Destaques do Pomodoro */
    .theme-bg-accent { background-color: var(--accent-color) !important; }
    .theme-bg-accent-hover:hover { background-color: var(--accent-hover) !important; }
    .theme-text-accent { color: var(--accent-color) !important; }
    .theme-text-accent-hover:hover { color: var(--accent-hover) !important; }
    .theme-bg-accent-muted { background-color: var(--accent-muted) !important; }
    .theme-border-accent { border-color: var(--accent-color) !important; }
    .theme-shadow-accent { box-shadow: 0 10px 15px -3px var(--accent-glow), 0 4px 6px -4px var(--accent-glow) !important; }
    
    /* Customização de rolagem e design padrão */
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: var(--border-color) !important;
      border-radius: 9999px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background-color: var(--text-muted) !important;
    }
    
    /* Impedir rolagem elástica irritante em navegadores móveis */
    body {

    // --- STREAMING_CHUNK: Utilitários matemáticos e de calendário para cronômetro e ranking... ---
    function getStartOfWeek() {
      const d = new Date();
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      monday.setHours(0,0,0,0);
      return monday;
    }

    function getStartOfMonth() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0, 0);
    }

    function safeParseDate(field) {
      if (!field) return new Date();
      if (typeof field.toDate === 'function') return field.toDate();
      if (field.seconds) return new Date(field.seconds * 1000);
      const parsed = new Date(field);
      return isNaN(parsed.getTime()) ? new Date() : parsed;
    }

      if (uStats.totalHours >= 10) badges.push({ name: "Focado", icon: "🔥", desc: "Mais de 10 horas de foco", color: "border-orange-500/30 text-orange-400 bg-orange-500/5" });
      if (uStats.totalHours >= 50) badges.push({ name: "Mestre", icon: "🏆", desc: "Mais de 50 horas de foco", color: "border-yellow-500/30 text-yellow-400 bg-yellow-500/5" });
      if (uStats.sessionCount >= 5) badges.push({ name: "Consistente", icon: "⚡", desc: "Mais de 5 sessões", color: "border-cyan-500/30 text-cyan-400 bg-cyan-500/5" });
      return badges;
    }

    function isParticipantOnline(p) {
      if (!p || !p.lastActive) return false;
      const lastActiveTime = p.lastActive.toMillis ? p.lastActive.toMillis() : new Date(p.lastActive).getTime();
      return (Date.now() - lastActiveTime) < 45000;
    }

    function formatTime(totalSecs) {
      const hrs = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;
      return `${hrs > 0 ? hrs + ':' : ''}${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function getFilteredSessions(sessionsList, rankingFilter, selectedPastMonth) {
      const list = sessionsList || [];
      if (rankingFilter === 'semanal') {
        const startOfWeek = getStartOfWeek();
        return list.filter(s => {
          const sDate = safeParseDate(s.startTime);
          return sDate >= startOfWeek;
        });
      }
      if (rankingFilter === 'mensal') {
        const startOfMonth = getStartOfMonth();
        return list.filter(s => {
          const sDate = safeParseDate(s.startTime);
          return sDate >= startOfMonth;
        });
      }
      if (rankingFilter === 'mensal-passado' && selectedPastMonth) {
        return list.filter(s => {
          const sDate = safeParseDate(s.startTime);
          const label = sDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
          return label.toLowerCase() === selectedPastMonth.toLowerCase();
        });
      }
      return list;
    }

    // --- CONVERSORES INTELIGENTES DE LINKS DE MÚSICA ---
    function getSpotifyEmbed(url) {
      if (!url) return null;
      const reg = /spotify\.com\/(playlist|album|track|artist)\/([a-zA-Z0-9]+)/;
      const match = url.match(reg);
      if (match) {
        return `https://open.spotify.com/embed/${match[1]}/${match[2]}`;
      }
      return null;
    }

    function getYoutubeEmbed(url) {
      if (!url) return null;
      const playlistReg = /[&?]list=([^&]+)/;
      const playlistMatch = url.match(playlistReg);
      if (url.includes('playlist') && playlistMatch) {
        return `https://www.youtube.com/embed/videoseries?list=${playlistMatch[1]}`;
      }
      const videoReg = /(?:v=|youtu\.be\/|embed\/)([^?&]+)/;
      const videoMatch = url.match(videoReg);
      if (videoMatch) {
        let embedUrl = `https://www.youtube.com/embed/${videoMatch[1]}`;
        if (playlistMatch) {
          embedUrl += `?list=${playlistMatch[1]}`;
        }
        return embedUrl;
      }
      return null;
    }

        timerBaseTimeRef.current = Date.now();
        let initialSeconds = timerSeconds;
        if (timerType === 'pomodoro' && timerSeconds === 0) {
          const targetLimit = (pomodoroStage === 'work' ? customFocusMinutes : customBreakMinutes) * 60;
          timerAccumulatedSecondsRef.current = targetLimit;
          setTimerSeconds(targetLimit);

        updateFirebaseTimerState(initialSeconds, true);

      function handlePauseTimer() {

      function handleStopTimer() {
        if (timerSeconds === 0 && timerType === 'free') return;
        setIsTimerRunning(false);
        const elapsedSinceStart = isTimerRunning ? Math.floor((Date.now() - timerBaseTimeRef.current) / 1000) : 0;

        const val = parseInt(value, 10);
        setCustomBreakMinutes(val);
        localStorage.setItem('study_custom_break_minutes', val.toString());
        if (timerType === 'pomodoro' && !isTimerRunning && pomodoroStage === 'break') {
          setTimerSeconds(val * 60);
        }
      }

      function handleToggleTimerType(type) {
        if (isTimerRunning) return;
        setTimerType(type);
        if (type === 'pomodoro') {
          const nextSecs = (pomodoroStage === 'work' ? customFocusMinutes : customBreakMinutes) * 60;
          setTimerSeconds(nextSecs);
        } else {
          setTimerSeconds(0);
        }
      }

      function handlePomodoroFinished() {
        setIsTimerRunning(false);
        const sub = subjects?.find(s => s.id === selectedSubjectId);
        const focusDurationSecs = customFocusMinutes * 60;
        const newSession = {
          id: 'sess_' + Date.now(),
          userId: activeProfile.id,
          userName: activeProfile.name,
          userAvatar: activeProfile.avatar,
          userColor: activeProfile.markerColor,
          subjectId: selectedSubjectId || '1',
          subjectName: sub?.name || 'Matéria Excluída',
          subjectColor: sub?.color || '#10b981',
          durationSeconds: focusDurationSecs,
          startTime: new Date().toISOString(),
          type: 'pomodoro'
        };
        if (pomodoroStage === 'work') {
          try {
            if (!apiDisabledError && db) {
              db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sessions').add({
                userId: activeProfile.id,
                userName: activeProfile.name,
                userAvatar: activeProfile.avatar,
                userColor: activeProfile.markerColor,
                subjectId: selectedSubjectId || '1',
                subjectName: sub?.name || 'Matéria Excluída',
                subjectColor: sub?.color || '#10b981',
                durationSeconds: focusDurationSecs,
                startTime: firebase.firestore.Timestamp.now(),
                type: 'pomodoro'
              }).catch(err => console.warn("Firestore: Erro ao gravar pomodoro:", err.message));
              sendGroupNotification(`completou um Pomodoro de Foco (${customFocusMinutes} min) em ${sub?.name || 'Estudos'}! 🧠✨`);
            } else {
              const updatedSessions = [newSession, ...sessions];
              setSessions(updatedSessions);
              localStorage.setItem('study_sessions_cache', JSON.stringify(updatedSessions));
            }
            triggerLocalNotification("Pomodoro de foco concluído! Hora de descansar!");
            
            const nextSecs = customBreakMinutes * 60;
            setPomodoroStage('break');
            timerAccumulatedSecondsRef.current = nextSecs;
            setTimerSeconds(nextSecs);
            updateFirebaseTimerState(nextSecs, false, 'break', nextSecs);
          } catch (err) {
            console.error(err);
          }
        } else {
          sendGroupNotification(`concluiu o descanso e está pronto para focar! 💪`);
          triggerLocalNotification("Descanso finalizado! Vamos voltar aos estudos?");
          
          const nextSecs = customFocusMinutes * 60;
          setPomodoroStage('work');
          timerAccumulatedSecondsRef.current = nextSecs;
          setTimerSeconds(nextSecs);
          updateFirebaseTimerState(nextSecs, false, 'work', nextSecs);
        }
      }

      // --- STREAMING_CHUNK: Loop de sincronismo reativo do temporizador... ---
      useEffect(() => {
        let intervalId = null;
        if (isTimerRunning) {
          intervalId = setInterval(() => {
            const elapsed = Math.floor((Date.now() - timerBaseTimeRef.current) / 1000);
            
            if (timerType === 'free') {
              const nextSeconds = timerAccumulatedSecondsRef.current + elapsed;
              setTimerSeconds(nextSeconds);
              
              if (nextSeconds % 10 === 0 && lastSyncedSecondRef.current !== nextSeconds) {
                lastSyncedSecondRef.current = nextSeconds;
                updateFirebaseTimerState(nextSeconds, true);
              }
            } else {
              const nextSeconds = Math.max(0, timerAccumulatedSecondsRef.current - elapsed);
              
              if (nextSeconds <= 0) {
                clearInterval(intervalId);
                setTimerSeconds(0);
                handlePomodoroFinished();
              } else {
                setTimerSeconds(nextSeconds);
                if (nextSeconds % 10 === 0 && lastSyncedSecondRef.current !== nextSeconds) {
                  lastSyncedSecondRef.current = nextSeconds;
                  updateFirebaseTimerState(nextSeconds, true);
                }
              }
            }
          }, 100); 
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [isTimerRunning, timerType, pomodoroStage, selectedSubjectId, customFocusMinutes, customBreakMinutes]);

      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && isTimerRunning) {
            const elapsed = Math.floor((Date.now() - timerBaseTimeRef.current) / 1000);
            if (timerType === 'free') {
              const nextSeconds = timerAccumulatedSecondsRef.current + elapsed;
              setTimerSeconds(nextSeconds);
            } else {
              const nextSeconds = Math.max(0, timerAccumulatedSecondsRef.current - elapsed);
              if (nextSeconds <= 0) {
                setTimerSeconds(0);
                setIsTimerRunning(false);
                handlePomodoroFinished();
              } else {
                setTimerSeconds(nextSeconds);
              }
            }
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
      }, [isTimerRunning, timerType, pomodoroStage, customFocusMinutes, customBreakMinutes]);

      useEffect(() => {
        isTimerRunningRef.current = isTimerRunning;
        handleStartTimerRef.current = handleStartTimer;
        handlePauseTimerRef.current = handlePauseTimer;
        handleStopTimerRef.current = handleStopTimer;
      }, [isTimerRunning]);

      useEffect(() => {
        if (window.pipWindow && !window.pipWindow.closed) {
          const doc = window.pipWindow.document;
          
          const clockEl = doc.getElementById('clock');
          if (clockEl) {
            clockEl.textContent = formatTime(timerSeconds);
          }
          
          const btnPlayPause = doc.getElementById('btn-play-pause');
          if (btnPlayPause) {
            btnPlayPause.innerHTML = isTimerRunning
              ? `<svg style="width:11px;height:11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg> Pausar`
              : `<svg style="width:11px;height:11px" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg> Iniciar`;
            
            btnPlayPause.style.borderColor = isTimerRunning ? 'rgba(255, 255, 255, 0.15)' : 'var(--accent-color)';
            btnPlayPause.style.color = isTimerRunning ? 'var(--text-muted)' : 'var(--text-main)';
            btnPlayPause.style.backgroundColor = isTimerRunning ? 'rgba(255, 255, 255, 0.02)' : 'var(--accent-muted)';
          }
          
          const subjectEl = doc.getElementById('subject');
          if (subjectEl) {
            const sub = subjects.find(s => s.id === selectedSubjectId) || { name: 'Estudos', color: '#10b981' };
            subjectEl.textContent = sub.name;
            subjectEl.style.color = sub.color || 'var(--accent-color)';
          }
          
          const stageEl = doc.getElementById('stage');
          if (stageEl) {
            if (timerType === 'pomodoro') {
              stageEl.textContent = pomodoroStage === 'work' ? '🧠 FOCO ATIVO' : '☕ DESCANSO';
              stageEl.style.display = 'inline-block';
              stageEl.style.backgroundColor = pomodoroStage === 'work' ? 'rgba(244, 63, 94, 0.15)' : 'rgba(16, 185, 129, 0.15)';
              stageEl.style.color = pomodoroStage === 'work' ? '#f43f5e' : '#10b981';
            } else {
              stageEl.style.display = 'none';
            }
          }
          
          const progressContainer = doc.querySelector('.progress-container');
          const progressBar = doc.getElementById('progress-bar');
          if (progressContainer && progressBar) {
            if (timerType === 'pomodoro') {
              const targetLimit = (pomodoroStage === 'work' ? customFocusMinutes : customBreakMinutes) * 60;
              const percentage = Math.min(100, Math.max(0, ((targetLimit - timerSeconds) / targetLimit) * 100));
              progressBar.style.width = `${percentage}%`;
              progressBar.style.backgroundColor = pomodoroStage === 'work' ? '#f43f5e' : 'var(--accent-color)';
              progressContainer.style.display = 'block';
            } else {
              progressContainer.style.display = 'none';
            }
          }
        }
      }, [timerSeconds, isTimerRunning, selectedSubjectId, subjects, timerType, pomodoroStage, customFocusMinutes, customBreakMinutes, selectedMode, selectedColor]);

      // --- STREAMING_CHUNK: Instanciando Relógio Flutuante (Picture-In-Picture nativo ou fallback)... ---
      function triggerPopoutTimer() {
        if ('documentPictureInPicture' in window) {
          if (window.pipWindow) {
            window.pipWindow.close();
            window.pipWindow = null;
            setIsPipActive(false);
            return;
          }
          
          window.documentPictureInPicture.requestWindow({
            width: 320,

            const rootStyles = getComputedStyle(document.documentElement);
            const bgMain = rootStyles.getPropertyValue('--bg-main').trim();

              }

              }
              .progress-container {
                width: 80%;
                height: 4px;
                background-color: rgba(255, 255, 255, 0.05);
                border-radius: 9999px;
                overflow: hidden;
                margin-bottom: 12px;
                display: none;
              }
              #progress-bar {
                height: 100%;
                width: 0%;
                transition: width 0.3s ease;
              }
              #controls {
                display: flex;
                gap: 10px;
              }
              button {
                background-color: rgba(255, 255, 255, 0.03);
                color: var(--text-main);
                border: 1px solid var(--border-color);
                padding: 5px 14px;
                border-radius: 20px;
                font-size: 0.7rem;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 5px;
                transition: all 0.2s ease;
              }
              button:hover {
                background-color: var(--accent-muted);
                border-color: var(--accent-color);
                color: var(--accent-color);
                transform: translateY(-1px);
              }
              button:active {
                transform: translateY(0);
              }
              #btn-stop:hover {
                background-color: rgba(239, 68, 68, 0.1);

              }
            `;
            pipWindow.document.head.appendChild(style);
            
            const container = pipWindow.document.createElement('div');
            container.className = 'widget-container';
            
            const clockEl = pipWindow.document.createElement('div');
            clockEl.id = 'clock';
            clockEl.textContent = formatTime(timerSeconds);
            
            const sub = subjects.find(s => s.id === selectedSubjectId) || { name: 'Estudos', color: '#10b981' };
            
            const subjectEl = pipWindow.document.createElement('div');
            subjectEl.id = 'subject';
            subjectEl.textContent = sub.name;
            subjectEl.style.color = sub.color;
            
            const badgeRow = pipWindow.document.createElement('div');
            badgeRow.className = 'badge-row';
            
            const stageEl = pipWindow.document.createElement('div');
            stageEl.id = 'stage';
            badgeRow.appendChild(stageEl);
            
            const progressContainer = pipWindow.document.createElement('div');
            progressContainer.className = 'progress-container';
            const progressBar = pipWindow.document.createElement('div');
            progressBar.id = 'progress-bar';
            progressContainer.appendChild(progressBar);
            
            const controlsEl = pipWindow.document.createElement('div');
            controlsEl.id = 'controls';
            
            const btnPlayPause = pipWindow.document.createElement('button');
            btnPlayPause.id = 'btn-play-pause';
            btnPlayPause.innerHTML = isTimerRunning
              ? `<svg style="width:10px;height:10px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg> Pausar`
              : `<svg style="width:10px;height:10px" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg> Iniciar`;
            btnPlayPause.addEventListener('click', () => {
              window.triggerGlobalStartOrPause();
            });
            
            const btnStop = pipWindow.document.createElement('button');
            btnStop.id = 'btn-stop';
            btnStop.innerHTML = `<svg style="width:10px;height:10px" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> Parar`;
            btnStop.addEventListener('click', () => {
              window.triggerGlobalStopTimer();
            });
            
            controlsEl.appendChild(btnPlayPause);
            controlsEl.appendChild(btnStop);
            
            container.appendChild(clockEl);
            container.appendChild(subjectEl);
            container.appendChild(badgeRow);
            container.appendChild(progressContainer);
            container.appendChild(controlsEl);
            pipWindow.document.body.appendChild(container);
            
            pipWindow.addEventListener('pagehide', () => {
              window.pipWindow = null;
              setIsPipActive(false);
            });
            
            setIsPipActive(true);
            triggerLocalNotification("Relógio flutuante ativado! 🕒");
          }).catch((err) => {
            console.warn("Document PiP recusado, Picture-in-Picture nativo indisponível.", err);
          });
          return;
        }
        triggerLocalNotification("Seu navegador não suporta Picture-in-Picture avançado.");
      }

      window.triggerGlobalStartOrPause = () => {
        if (isTimerRunningRef.current) {
          if (handlePauseTimerRef.current) handlePauseTimerRef.current();
        } else {
          if (handleStartTimerRef.current) handleStartTimerRef.current();
        }
      };

      window.triggerGlobalStopTimer = () => {
        if (handleStopTimerRef.current) handleStopTimerRef.current();
        if (window.pipWindow) {
          window.pipWindow.close();
        }
      };

      // --- STREAMING_CHUNK: Gestão de Contas de Estudantes e Perfis do Aparelho... ---
      function handleSignOut() {
        if (isTimerRunning) {
          openConfirmModal(
            "Pausar Estudos?", 
            "Isso pausará o seu cronômetro ativo. Deseja realmente desconectar?", 
            () => {
              setIsTimerRunning(false);
              executeSignOut();
            }
          );
        } else {
          executeSignOut();
        }
      }

        if (auth) {
          auth.signOut().catch(() => {});
        }
        setUser(null);
        setActiveProfile(null);
        localStorage.removeItem('study_active_profile_v2');
        setTempProfileSelected(null);
        setLoginEmail('');
        setLoginPassword('');
        triggerLocalNotification("Sessão finalizada com sucesso! 👋");

              localStorage.setItem('study_custom_profiles', JSON.stringify(updatedCustom));

                .then(() => {

        const newProfile = { id: newId, name: trimmed, avatar: profileFormAvatar, markerColor: profileFormColor };

        localStorage.setItem('study_custom_profiles', JSON.stringify(updated));

          db.collection('artifacts').doc(appId).collection('public').doc('data').collection('participants').doc(newId).set({

            avatar: profileFormAvatar,

            isTimerRunning: false,
            pomodoroStage: 'work',
            timerTargetSeconds: 0,
            userMode: selectedMode,
            userColor: selectedColor
          }).catch(err => {

          });

        setProfileFormName('');
        setIsCreatingProfile(false);
        triggerLocalNotification(`Perfil de ${trimmed} criado com sucesso! 🎉`);

      function handleEditProfile(e) {
        e.preventDefault();
        const trimmed = profileFormName.trim();
        if (!trimmed) return;
        const targetProfile = activeProfile;
        if (!targetProfile) return;
        const updatedProfile = { ...targetProfile, name: trimmed, avatar: profileFormAvatar, markerColor: profileFormColor };

          const updatedCustomList = customProfiles.map(p => p.id === targetProfile.id ? updatedProfile : p);
          setCustomProfiles(updatedCustomList);
          localStorage.setItem('study_custom_profiles', JSON.stringify(updatedCustomList));
        }
        setActiveProfile(updatedProfile);
        if (db && !apiDisabledError) {
          db.collection('artifacts').doc(appId).collection('public').doc('data').collection('participants').doc(targetProfile.id).set({
            name: trimmed,
            avatar: profileFormAvatar,
            markerColor: profileFormColor,
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(err => {
            console.warn("Firestore: Sem permissão para editar perfil:", err.message);
          });
        }
        setIsEditingProfile(false);
        triggerLocalNotification("Perfil atualizado com sucesso!");

      // --- STREAMING_CHUNK: Bloco de Afazeres (To-Do) por Estudante... ---
      function handleAddTodo(e) {
        e.preventDefault();
        const text = todoInput.trim();
        if (!text || !activeProfile) return;
        const sub = subjects.find(s => s.id === todoSelectedSubjectId);
        const newTodo = {
          text,
          completed: false,
          subjectId: todoSelectedSubjectId || '',
          subjectName: sub ? sub.name : '',
          subjectColor: sub ? sub.color : '#475569',
          createdAt: Date.now()
        };
        if (db && !apiDisabledError && user) {
          db.collection('artifacts').doc(appId).collection('users').doc(activeProfile.id).collection('todos').add(newTodo)
            .then(() => triggerLocalNotification("Tarefa criada e persistida no seu perfil! ✨"))
            .catch(err => {
              console.warn("Firestore: Sem permissão para criar tarefa:", err.message);
              triggerLocalNotification("Sem permissão para salvar tarefa.");
            });
        } else {

      function handleToggleTodo(todoId, currentStatus) {
        if (!activeProfile) return;
        if (db && !apiDisabledError && user) {
          db.collection('artifacts').doc(appId).collection('users').doc(activeProfile.id).collection('todos').doc(todoId).update({
            completed: !currentStatus
          }).catch(err => console.warn("Firestore: Sem permissão para atualizar tarefa:", err.message));
        } else {
          const updated = todos.map(t => t.id === todoId ? { ...t, completed: !currentStatus } : t);
          setTodos(updated);
          localStorage.setItem(`study_todos_${activeProfile.id}`, JSON.stringify(updated));
        }
      }

          localStorage.setItem(`study_todos_${activeProfile.id}`, JSON.stringify(updated));

        const isSpotify = getSpotifyEmbed(link) !== null;
        const isYoutube = getYoutubeEmbed(link) !== null;

        if (!isSpotify && !isYoutube) {
          triggerLocalNotification("Por favor, insira um link válido do Spotify ou YouTube!");
          return;
        }

        const newPlaylist = {
          title,
          link,
          userId: activeProfile.id,

          userAvatar: activeProfile.avatar,

        };

          db.collection('artifacts').doc(appId).collection('public').doc('data').collection('playlists').add({

      function handleEmailPasswordLogin(e) {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);
        const email = loginEmail.trim();
        const password = loginPassword;
        if (!email || !password) {
          setLoginError('Preencha os campos de e-mail e senha correspondentes ao perfil!');
          setIsLoggingIn(false);
          return;
        }
        if (!auth || apiDisabledError) {
          triggerLocalNotification("Entrada offline no perfil de " + tempProfileSelected.name + "!");
          localStorage.setItem(`study_saved_email_${tempProfileSelected.id}`, email);
          selectProfile(tempProfileSelected);
          setIsLoggingIn(false);
          return;
        }
        auth.signInWithEmailAndPassword(email, password)
          .then((authResult) => {
            if (authResult && authResult.user) {
              triggerLocalNotification("Autenticado com sucesso para o perfil de " + tempProfileSelected.name + "! 📚");
              localStorage.setItem(`study_saved_email_${tempProfileSelected.id}`, email);
              selectProfile(tempProfileSelected);
            }
          })
          .catch((error) => {
            console.error("[Login] Erro na autenticação:", error.message);
            let userMsg = 'E-mail ou senha incorretos para o perfil. Verifique os dados e tente novamente.';
            if (error.code === 'auth/invalid-email') userMsg = 'Formato de e-mail inválido.';
            if (error.code === 'auth/network-request-failed') userMsg = 'Erro de rede. Sem conexão activa com Firebase.';
            setLoginError(userMsg);
          })
          .finally(() => {
            setIsLoggingIn(false);
          });
      }

      // --- STREAMING_CHUNK: Observadores e sincronizadores de estado local e remoto... ---

          }, () => setApiDisabledError(true));

        // Listener de sessões

            const list = [];
            snapshot.forEach((doc) => {
              list.push({ id: doc.id, ...doc.data() });

            list.sort((a, b) => (b.startTime?.seconds || 0) - (a.startTime?.seconds || 0));

            localStorage.setItem('study_sessions_cache', JSON.stringify(list));
          }, () => setApiDisabledError(true));

        // Listener de bate-papo

          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => {

            list.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
            setChatMessages(list);
            localStorage.setItem('study_chat_cache', JSON.stringify(list));
          });

        // Listener de Playlists
        const unsubPlaylists = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('playlists')
          .onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => {
              list.push({ id: doc.id, ...doc.data() });
            });
            list.sort((a, b) => {
              const dateA = a.createdAt?.seconds ? a.createdAt.seconds * 1000 : new Date(a.createdAt).getTime();
              const dateB = b.createdAt?.seconds ? b.createdAt.seconds * 1000 : new Date(b.createdAt).getTime();
              return dateB - dateA;
            });
            setPlaylists(list);
            localStorage.setItem('study_playlists_cache', JSON.stringify(list));
          });

        // Listener de configurações globais
        const unsubSettings = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('countdown')

        return () => {
          unsubParticipants();
          unsubSubjects();

          unsubChat();
          unsubPlaylists();
          unsubSettings();

      // --- STREAMING_CHUNK: Calculando Métricas do Painel Geral do Grupo... ---
      const activeParticipantsList = useMemo(() => {
        return allProfilesList.map(preset => {

      const filteredSessions = useMemo(() => {
        return getFilteredSessions(sessions, rankingFilter, selectedPastMonth);
      }, [sessions, rankingFilter, selectedPastMonth]);

      const totalGroupHours = useMemo(() => {
        const secs = filteredSessions.reduce((a, b) => a + (b.durationSeconds || 0), 0);
        return (secs / 3600).toFixed(1);
      }, [filteredSessions]);

      const completedMonths = useMemo(() => {
        const monthsSet = new Set();
        sessions.forEach(s => {
          const sDate = safeParseDate(s.startTime);
          const monthLabel = sDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
          const currentMonthLabel = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
          if (monthLabel.toLowerCase() !== currentMonthLabel.toLowerCase()) {
            monthsSet.add(monthLabel);
          }
        });
        const arr = Array.from(monthsSet);
        if (arr.length > 0 && !selectedPastMonth) {
          setSelectedPastMonth(arr[0]);
        }
        return arr;
      }, [sessions]);

      const participantStats = useMemo(() => {
        const stats = allProfilesList.map(preset => {
          const userSessions = filteredSessions.filter(s => s.userId === preset.id);
          const totalSecs = userSessions.reduce((sum, s) => sum + (s.durationSeconds || 0), 0);
          return {
            id: preset.id,
            name: preset.name,
            avatar: preset.avatar,
            markerColor: preset.markerColor,
            totalHours: parseFloat((totalSecs / 3600).toFixed(1)),
            sessionCount: userSessions.length
          };
        });
        return stats.sort((a, b) => b.totalHours - a.totalHours);
      }, [allProfilesList, filteredSessions]);

      const leaderParticipant = useMemo(() => {
        if (participantStats.length === 0 || participantStats[0].totalHours === 0) return null;
        return participantStats[0];
      }, [participantStats]);

      const subjectStats = useMemo(() => {
        const subMap = {};
        
        subjects.forEach(sub => {
          subMap[sub.id] = {
            id: sub.id,
            name: sub.name,
            color: sub.color || '#10b981',
            totalSeconds: 0
          };
        });

        filteredSessions.forEach(s => {
          const sId = s.subjectId;
          if (sId && subMap[sId]) {
            subMap[sId].totalSeconds += s.durationSeconds || 0;
          } else {
            const deletedId = sId || 'deleted';
            if (!subMap[deletedId]) {
              subMap[deletedId] = {
                id: deletedId,
                name: s.subjectName || 'Matéria Excluída',
                color: s.subjectColor || '#94a3b8',
                totalSeconds: 0
              };
            }
            subMap[deletedId].totalSeconds += s.durationSeconds || 0;
          }
        });

        const totalSecsAll = Object.values(subMap).reduce((a, b) => a + b.totalSeconds, 0) || 1;
        const stats = Object.values(subMap).map(sub => ({
          ...sub,
          totalHours: parseFloat((sub.totalSeconds / 3600).toFixed(1)),
          percentage: totalSecsAll > 1 ? Math.round((sub.totalSeconds / totalSecsAll) * 100) : 0
        }));
        
        return stats.sort((a, b) => b.totalSeconds - a.totalSeconds);
      }, [subjects, filteredSessions]);

      const groupMinutesToday = useMemo(() => {
        const todayStr = new Date().toDateString();
        const todaySessions = sessions.filter(s => {
          const sDate = safeParseDate(s.startTime);
          return sDate.toDateString() === todayStr;
        });
        const secs = todaySessions.reduce((a, b) => a + (b.durationSeconds || 0), 0);
        return Math.round(secs / 60);
      }, [sessions]);

      const metaPercentage = useMemo(() => {
        if (metaDiaria <= 0) return 100;
        return Math.min(Math.round((groupMinutesToday / metaDiaria) * 100), 100);
      }, [groupMinutesToday, metaDiaria]);

      const groupDailyAverage = useMemo(() => {
        if (filteredSessions.length === 0) return "0.0";
        const datesSet = new Set();
        filteredSessions.forEach(s => {
          const sDate = safeParseDate(s.startTime);
          datesSet.add(sDate.toDateString());
        });
        const numDays = datesSet.size || 1;
        const totalSecs = filteredSessions.reduce((a, b) => a + (b.durationSeconds || 0), 0);
        return ((totalSecs / 3600) / numDays).toFixed(1);
      }, [filteredSessions]);

      const daysRemaining = useMemo(() => {
        if (!endDate) return 0;
        try {
          const target = new Date(endDate + 'T00:00:00');
          if (isNaN(target.getTime())) return 0;
          const today = new Date();
          today.setHours(0,0,0,0);
          const diffTime = target - today;
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          return diffDays > 0 ? diffDays : 0;
        } catch (e) {
          return 0;
        }
      }, [endDate]);

      };

      const renderPersonalStatsAndTodoTab = () => {
        const uStats = participantStats.find(ps => activeProfile.id === ps.id) || { totalHours: 0, sessionCount: 0 };
        const personalSessions = sessions.filter(s => s.userId === activeProfile.id);
        
        // --- CÁLCULO DAS HORAS DIÁRIAS DOS ÚLTIMOS 7 DIAS ---
        const last7Days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          last7Days.push({
            dateStr: d.toDateString(),
            label: d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''),
            hours: 0
          });
        }
        
        personalSessions.forEach(s => {
          const sDate = safeParseDate(s.startTime);
          const match = last7Days.find(d => d.dateStr === sDate.toDateString());
          if (match) {
            match.hours += (s.durationSeconds || 0) / 3600;
          }
        });

        last7Days.forEach(d => {
          d.hours = parseFloat(d.hours.toFixed(1));
        });

        const maxDayHours = Math.max(...last7Days.map(d => d.hours), 1);

        // --- CÁLCULO DA DIVISÃO POR DISCIPLINA ---
        const personalBySubject = {};
        subjects.forEach(sub => {
          personalBySubject[sub.id] = { 
            name: sub.name, 
            color: sub.color || '#10b981', 
            seconds: 0 
          };
        });

        personalSessions.forEach(s => {
          const sSubId = s.subjectId || 'deleted';
          if (!personalBySubject[sSubId]) {
            personalBySubject[sSubId] = { 
              name: s.subjectName || 'Matéria Excluída', 
              color: s.subjectColor || '#94a3b8', 
              seconds: 0 
            };
          }
          personalBySubject[sSubId].seconds += s.durationSeconds || 0;
        });

        const totalPersonalSecs = Object.values(personalBySubject).reduce((a, b) => a + b.seconds, 0) || 1;
        const personalStatsArr = Object.values(personalBySubject).map(sub => ({
          ...sub,
          hours: parseFloat((sub.seconds / 3600).toFixed(1)),
          percent: totalPersonalSecs > 1 ? Math.round((sub.seconds / totalPersonalSecs) * 100) : 0
        })).sort((a, b) => b.seconds - a.seconds);

        const filteredTodos = todos.filter(t => {
          if (todoFilter === 'completed') return t.completed;
          if (todoFilter === 'pending') return !t.completed;
          return true;
        });

        return (

                    <strong className="text-2xl md:text-3xl font-black theme-text-accent block mt-1">{uStats.totalHours}h</strong>
                  </div>
                  <div className="theme-bg-input border theme-border p-3 md:p-4 rounded-2xl">
                    <span className="text-[10px] md:text-xs theme-text-muted block font-semibold">Sessões Focadas</span>
                    <strong className="text-2xl md:text-3xl font-black theme-text-accent block mt-1">{uStats.sessionCount}</strong>
                  </div>
                </div>
                <div className="space-y-3">
                  <span className="text-xs theme-text-muted uppercase tracking-wider font-bold block">Insígnias Liberadas</span>
                  {getParticipantBadges(uStats).length === 0 ? (
                    <p className="text-xs theme-text-muted">Ainda sem insígnias. Complete 1 hora de estudo para liberar!</p>
                  ) : (
                    <div className="space-y-2">
                      {getParticipantBadges(uStats).map((badge, i) => (
                        <div key={i} className={`p-3 rounded-xl border flex items-center gap-3 ${badge.color}`}>
                          <span className="text-2xl select-none">{badge.icon}</span>
                          <div className="text-left">
                            <h5 className="font-bold text-sm leading-tight">{badge.name}</h5>
                            <p className="text-[10px] opacity-80 mt-0.5">{badge.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* CARD: GRÁFICO DE HORAS SEMANAIS (BARRAS) */}

                    const barHeight = day.hours > 0 ? `${(day.hours / maxDayHours) * 75}%` : '4px';
                    return (
                      <div key={i} className="flex flex-col items-center justify-end flex-1 h-full group">
                        <span className="text-[9px] md:text-[10px] font-bold theme-text-accent mb-1 transition-all duration-300">
                          {day.hours}h
                        </span>
                        <div 
                          className="w-4 sm:w-6 theme-bg-accent rounded-t-md transition-all duration-500 ease-out shadow-sm shadow-emerald-500/10 hover:brightness-110"
                          style={{ height: barHeight }}
                        ></div>
                        <span className="text-[8px] md:text-[9px] theme-text-muted font-black uppercase mt-2 tracking-wider">
                          {day.label}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* CARD: DIVISÃO POR DISCIPLINA */}
              <div className="theme-bg-card border theme-border rounded-3xl p-5 md:p-6 shadow-sm">
                <h3 className="font-bold text-base md:text-lg theme-text-main mb-4">Divisão Pessoal por Disciplina</h3>
                <div className="space-y-4">

                            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: sub.color }}></span>
                            {sub.name}
                          </span>
                          <span className="theme-text-muted">{sub.hours}h ({sub.percent}%)</span>

                        <div className="w-full theme-bg-input rounded-full h-1.5">
                          <div className="h-full rounded-full transition-all duration-300" style={{ width: `${sub.percent}%`, backgroundColor: sub.color }}></div>
                        </div>
                      </div>

                </div>

            {/* LISTA DE AFAZERES (TO-DO) */}

              </div>

              <form onSubmit={handleAddTodo} className="flex flex-col sm:flex-row gap-2 mb-4">

                <div className="flex gap-2">
                  <select
                    value={todoSelectedSubjectId}
                    onChange={e => setTodoSelectedSubjectId(e.target.value)}
                    className="flex-1 border theme-border rounded-xl px-3 py-3 sm:py-2 text-xs theme-bg-input theme-text-main focus:outline-none min-h-[44px]"
                  >
                    {subjects.map(s => (
                      <option key={s.id} value={s.id}>{s.name}</option>
                    ))}
                  </select>
                  <button
                    type="submit"
                    className="theme-bg-accent theme-bg-accent-hover text-white px-5 py-3 sm:py-2 rounded-xl text-xs font-bold transition-colors border-none cursor-pointer min-h-[44px]"
                  >
                    Criar
                  </button>
                </div>
              </form>

              <div className="flex-1 overflow-y-auto space-y-2 max-h-[340px] pr-1 scrollbar-thin">
                {filteredTodos.length === 0 ? (
                  <div className="text-center py-12 theme-text-muted">
                    <p className="text-xs">Nenhuma tarefa encontrada neste filtro.</p>
                    <p className="text-[10px] mt-1">Crie tarefas acima para acompanhar o progresso!</p>
                  </div>
                ) : (
                  filteredTodos.map(todo => (
                    <div key={todo.id} className="flex items-center justify-between p-3.5 theme-bg-input border theme-border rounded-xl">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        <input
                          type="checkbox"
                          checked={todo.completed}
                          onChange={() => handleToggleTodo(todo.id, todo.completed)}
                          className="w-5 h-5 sm:w-4 sm:h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                        />
                        <div className="min-w-0">
                          <p className={`text-xs font-semibold truncate ${todo.completed ? 'line-through theme-text-muted' : 'theme-text-main'}`}>
                            {todo.text}
                          </p>
                          {todo.subjectName && (
                            <span className="inline-flex items-center gap-1 text-[9px] font-bold mt-1 uppercase" style={{ color: todo.subjectColor }}>
                              <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: todo.subjectColor }}></span>
                              {todo.subjectName}
                            </span>
                          )}
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => handleDeleteTodo(todo.id)}
                        className="p-2 text-slate-500 hover:text-rose-500 transition-colors bg-transparent border-none cursor-pointer min-w-[36px] min-h-[36px] flex items-center justify-center"
                        title="Deletar Tarefa"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        );
      };

      // --- RENDERING CONDITIONS ---
      if (!tempProfileSelected && !activeProfile) {
        return renderNetflixSelectScreen();
      }

      if (tempProfileSelected && !activeProfile) {
        return renderLoginScreen();
      }

        <div className="min-h-screen lg:h-screen w-screen font-sans flex flex-col lg:flex-row relative transition-all duration-300 theme-bg-main theme-text-main overflow-x-hidden lg:overflow-hidden pb-16 lg:pb-0" style={activeThemeObj.variables}>
          {localNotification && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900 border border-emerald-500/30 text-emerald-400 px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-xs font-semibold animate-bounce">
              <span>✨</span> {localNotification}
            </div>

          {/* CABEÇALHO MOBILE (STICKY TOP BAR) */}

            <div className="flex items-center gap-2">
              <span className="p-1.5 rounded-lg theme-bg-input theme-text-accent font-semibold flex items-center justify-center">
                <PharmacyIcon className="w-5 h-5" />
              </span>
              <h1 className="font-extrabold text-sm tracking-tight theme-text-main">Farmácia</h1>
              <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
            </div>
            
            {activeProfile && (
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setIsMobileMenuOpen(true)}
                  className="p-2 hover:bg-slate-800/10 theme-text-muted hover:theme-text-main rounded-lg transition-colors border-none bg-transparent cursor-pointer min-w-[36px] min-h-[36px]"
                  title="Configurações e Menu"
                >
                  <MenuIcon className="w-5 h-5" />
                </button>
                <div className="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center border theme-border overflow-hidden select-none text-base">
                  {activeProfile.avatar}
                </div>
              </div>
            )}
          </header>

          {/* MENU LATERAL ESQUERDO (DESKTOP ONLY) */}
          <aside className="hidden lg:flex w-full lg:w-72 theme-bg-sidebar border-b lg:border-b-0 lg:border-r theme-border flex-col justify-between shrink-0 h-auto lg:h-full z-20 text-left overflow-hidden transition-all duration-300">
            <div className="flex-grow overflow-y-auto scrollbar-thin flex flex-col justify-between pb-4">
              <div>
                <div className="p-6 border-b theme-border flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="p-2.5 rounded-xl theme-bg-input theme-text-accent font-semibold">
                      <PharmacyIcon className="w-6 h-6" />
                    </span>
                    <div>
                      <h1 className="font-extrabold text-lg tracking-tight theme-text-main">Farmácia</h1>
                      <p className="theme-text-muted text-xs flex items-center gap-1 font-semibold">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Tempo Real

                    </div>

                </div>

                {activeProfile && (
                  <div className="theme-bg-input border mx-4 my-4 p-4 rounded-xl flex items-center justify-between shadow-inner theme-border">

                      <span className="select-none">{renderAvatar(activeProfile.avatar, "text-3xl")}</span>

                        <h4 className="font-semibold text-sm theme-text-main">{activeProfile.name}</h4>
                        <div className="flex items-center gap-1.5 mt-0.5">
                          <span className={`w-2.5 h-2.5 rounded-full ${MARKER_COLORS.find(c => c.id === activeProfile.markerColor)?.bg || 'bg-emerald-500'}`}></span>

            <div className="p-4 border-b theme-border flex items-center justify-between bg-black/10 shrink-0">
              <div className="flex items-center gap-2">
                <Icon name="MessageCircle" className="theme-text-accent w-5 h-5 animate-pulse" />
                <span className="font-bold text-sm tracking-wide theme-text-main">Bate-papo do Grupo</span>
              </div>
              <button

                onClick={() => setIsChatOpen(false)}
                className="p-2 hover:bg-black/10 theme-text-muted hover:theme-text-main rounded-lg transition-colors focus:outline-none bg-transparent border-none cursor-pointer min-w-[36px] min-h-[36px] flex items-center justify-center"

              >
                <Icon name="ChevronRight" className="w-4 h-4" />
              </button>
            </div>
            
            <div className="flex-grow p-4 overflow-y-auto space-y-3 scrollbar-thin flex flex-col bg-slate-950/20">
              {chatMessages.length === 0 ? (
                <div className="text-center py-12 theme-text-muted my-auto">
                  <p className="text-xs">Nenhuma mensagem.</p>
                  <p className="text-[10px] mt-1 font-sans">Diga olá para o seu grupo de estudos! 👋</p>
                </div>
              ) : (
                (() => {
                  let hasShownDivider = false;
                  return chatMessages.map((msg, i) => {
                    const isMe = msg.userId === activeProfile.id;
                    const colorObj = MARKER_COLORS.find(c => c.id === msg.userColor) || MARKER_COLORS[0];
                    
                    let msgTimeMillis = 0;
                    if (msg.timestamp) {
                      msgTimeMillis = msg.timestamp.toMillis ? msg.timestamp.toMillis() : new Date(msg.timestamp).getTime();
                    } else {
                      msgTimeMillis = Date.now();
                    }
                    
                    const isNewMessage = msgTimeMillis > sessionJoinTime;
                    const showDivider = isNewMessage && !hasShownDivider && !isMe;
                    if (showDivider) {
                      hasShownDivider = true;
                    }
                    return (
                      <React.Fragment key={msg.id || i}>
                        {showDivider && (
                          <div className="flex items-center my-4 select-none shrink-0 animate-pulse font-sans flex-row font-semibold">
                            <div className="flex-grow border-t border-emerald-500/20"></div>
                            <span className="mx-2 text-[8px] font-bold theme-text-accent uppercase tracking-widest bg-slate-950 px-2 py-0.5 rounded border border-emerald-500/10">Novas Mensagens</span>
                            <div className="flex-grow border-t border-emerald-500/20"></div>
                          </div>

                            <span className="select-none text-xs">{msg.userAvatar}</span>
                            <span className={`text-[9px] md:text-[10px] font-bold ${colorObj.text}`}>{msg.userName}</span>
                          </div>

                            {msg.text}

              </button>
            </form>
          </aside>

          {/* BARRA DE NAVEGAÇÃO INFERIOR (MOBILE BOTTOM NAV - APP STYLE) */}
          <nav className="lg:hidden fixed bottom-0 left-0 right-0 h-16 theme-bg-sidebar border-t theme-border flex items-center justify-around z-35 px-1 pb-safe shadow-xl">
            <button
              onClick={() => setActiveTab('dashboard')}
              className={`flex flex-col items-center justify-center flex-1 h-full py-1 text-center border-none bg-transparent cursor-pointer ${activeTab === 'dashboard' ? 'theme-text-accent' : 'theme-text-muted'}`}
            >
              <BarChart3 className="w-5 h-5 mb-0.5" />
              <span className="text-[9px] font-bold">Painel</span>
            </button>
            
            <button
              onClick={() => setActiveTab('cronometro')}
              className={`flex flex-col items-center justify-center flex-1 h-full py-1 text-center border-none bg-transparent cursor-pointer relative ${activeTab === 'cronometro' ? 'theme-text-accent' : 'theme-text-muted'}`}
            >
              <Clock className="w-5 h-5 mb-0.5" />
              <span className="text-[9px] font-bold">Foco</span>
              {isTimerRunning && (
                <span className="absolute top-2.5 right-6 w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
              )}
            </button>
            
            <button
              onClick={() => setIsChatOpen(!isChatOpen)}
              className={`flex flex-col items-center justify-center flex-1 h-full py-1 text-center border-none bg-transparent cursor-pointer relative ${isChatOpen ? 'theme-text-accent' : 'theme-text-muted'}`}
            >
              <MessageCircle className="w-5 h-5 mb-0.5" />
              <span className="text-[9px] font-bold">Chat</span>
              {unreadChatCount > 0 && (
                <span className="absolute top-1.5 right-4 bg-rose-600 text-white font-black text-[8px] px-1.5 py-0.5 rounded-full animate-pulse">{unreadChatCount}</span>
              )}
            </button>
            
            <button
              onClick={() => setActiveTab('grupo')}
              className={`flex flex-col items-center justify-center flex-1 h-full py-1 text-center border-none bg-transparent cursor-pointer ${activeTab === 'grupo' ? 'theme-text-accent' : 'theme-text-muted'}`}
            >
              <Users className="w-5 h-5 mb-0.5" />
              <span className="text-[9px] font-bold">Grupo</span>
            </button>
            
            <button
              onClick={() => setIsMobileMenuOpen(true)}
              className="flex flex-col items-center justify-center flex-1 h-full py-1 text-center border-none bg-transparent cursor-pointer theme-text-muted"
            >
              <MoreIcon className="w-5 h-5 mb-0.5" />
              <span className="text-[9px] font-bold">Mais</span>
            </button>
          </nav>

          {/* BOTTOM SHEET - MENU EXPANDIDO PARA CELULAR */}
          {isMobileMenuOpen && (
            <div className="lg:hidden fixed inset-0 z-50 bg-black/75 flex flex-col justify-end animate-fade-in">
              <div 
                className="absolute inset-0" 
                onClick={() => setIsMobileMenuOpen(false)}
              ></div>
              <div className="w-full theme-bg-sidebar border-t-2 theme-border-accent rounded-t-[2.5rem] p-6 space-y-6 relative z-10 max-h-[85vh] overflow-y-auto scrollbar-thin">
                <div className="w-12 h-1 bg-slate-700 rounded-full mx-auto mb-2"></div>
                
                <div className="flex items-center justify-between border-b theme-border pb-4">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl select-none">{activeProfile.avatar}</span>
                    <div className="text-left">
                      <h4 className="font-extrabold text-sm theme-text-main">{activeProfile.name}</h4>
                      <p className="text-[10px] theme-text-muted uppercase tracking-wider font-bold">Sessão Ativa</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => {
                      setIsMobileMenuOpen(false);
                      openExternalEditProfile(activeProfile);
                    }}
                    className="flex items-center gap-1 border theme-border px-3 py-1.5 rounded-xl text-xs theme-text-accent bg-transparent font-semibold cursor-pointer min-h-[38px]"
                  >
                    <Icon name="Edit3" className="w-3.5 h-3.5" /> Editar
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2 text-left">
                  {[
                    { id: 'materias', label: 'Disciplinas', icon: BookOpen },
                    { id: 'estatisticas', label: 'Estatísticas & Afazeres', icon: Award },
                    { id: 'playlists', label: 'Playlists', icon: Music },
                    { id: 'historico', label: 'Histórico', icon: Calendar },
                  ].map((subtab) => {
                    const SubIcon = subtab.icon;
                    return (
                      <button
                        key={subtab.id}
                        onClick={() => {
                          setActiveTab(subtab.id);
                          setIsMobileMenuOpen(false);
                        }}
                        className={`flex items-center gap-3 p-3.5 rounded-xl border-none transition-all ${activeTab === subtab.id ? 'theme-bg-accent-muted theme-text-accent font-bold' : 'theme-bg-input theme-text-muted'} cursor-pointer text-xs font-semibold`}
                      >
                        <SubIcon className="w-4 h-4" />
                        <span>{subtab.label}</span>
                      </button>
                    );
                  })}
                </div>

                {/* MOBILE CONTROLE DE PREFERÊNCIAS */}
                <div className="p-4 rounded-2xl theme-bg-input border theme-border space-y-4 text-left text-xs">
                  <div className="space-y-2">
                    <span className="font-bold theme-text-main text-[10px] uppercase tracking-wider block">Modo de Exibição</span>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => handlePreferenceChange('claro', null)}
                        className={`py-2 px-3 rounded-xl border font-bold text-xs transition-all cursor-pointer border-none min-h-[36px] ${selectedMode === 'claro' ? 'theme-bg-accent text-white shadow-sm' : 'theme-text-muted theme-bg-sidebar'}`}
                      >
                        ☀️ Claro
                      </button>
                      <button
                        type="button"
                        onClick={() => handlePreferenceChange('escuro', null)}
                        className={`py-2 px-3 rounded-xl border font-bold text-xs transition-all cursor-pointer border-none min-h-[36px] ${selectedMode === 'escuro' ? 'theme-bg-accent text-white shadow-sm' : 'theme-text-muted theme-bg-sidebar'}`}
                      >
                        🌙 Escuro
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <span className="font-bold theme-text-main text-[10px] uppercase tracking-wider block">Cor de Destaque</span>
                    <div className="grid grid-cols-3 gap-1.5">
                      {[
                        { id: 'azul', name: 'Azul', hex: '#3b82f6' },
                        { id: 'lilas', name: 'Lilás', hex: '#a855f7' },
                        { id: 'cafe', name: 'Bege', hex: '#dfb982' },
                        { id: 'verde', name: 'Verde', hex: '#10b981' },
                        { id: 'vermelho', name: 'Vinho', hex: '#f43f5e' },
                        { id: 'teal', name: 'Teal', hex: '#14b8a6' }
                      ].map(color => (
                        <button
                          key={color.id}
                          type="button"
                          onClick={() => handlePreferenceChange(null, color.id)}
                          className={`py-2 px-1 rounded-xl border text-[10px] font-bold text-center transition-all cursor-pointer flex flex-col items-center justify-center gap-1 border-none min-h-[36px] ${selectedColor === color.id ? 'theme-bg-accent-muted theme-text-accent' : 'theme-text-muted theme-bg-sidebar hover:theme-text-main'}`}
                        >
                          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: color.hex }}></span>
                          {color.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      setIsMobileMenuOpen(false);
                      handleSignOut();
                    }}
                    className="flex-1 py-3 bg-rose-600/10 hover:bg-rose-600/20 text-rose-400 font-bold text-xs rounded-xl border border-rose-500/20 cursor-pointer min-h-[44px]"
                  >
                    Desconectar Perfil
                  </button>
                  <button
                    onClick={() => setIsMobileMenuOpen(false)}
                    className="flex-1 py-3 theme-bg-input text-slate-300 font-bold text-xs rounded-xl border theme-border cursor-pointer min-h-[44px]"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CRIAR PERFIS */}
          {isCreatingProfile && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl relative text-left">
                <h3 className="text-xl md:text-2xl font-bold text-white mb-6">Criar Novo Perfil</h3>
                <form onSubmit={handleCreateProfile} className="space-y-6">
                  <div>
                    <label className="block text-sm font-semibold text-slate-300 mb-2">Nome do Estudante</label>
                    <input 
                      type="text" 
                      required 
                      maxLength={15}
                      placeholder="Ex: Pedro"
                      value={profileFormName}
                      onChange={e => setProfileFormName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-semibold min-h-[44px]"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-300 mb-2">Escolha seu Avatar</label>
                    <div className="grid grid-cols-6 gap-2">
                      {AVATAR_OPTIONS.map(a => (
                        <button
                          key={a}
                          type="button"
                          onClick={() => setProfileFormAvatar(a)}
                          className={`p-2 rounded-lg transition-all flex items-center justify-center overflow-hidden h-12 ${profileFormAvatar === a ? 'bg-[#223b31]' : 'bg-slate-950 border border-slate-800/60'} cursor-pointer`}
                        >
                          {renderAvatar(a, "text-xl")}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-300 mb-2">Sua Cor de Identificação</label>
                    <div className="grid grid-cols-4 gap-2">
                      {MARKER_COLORS.map(c => (
                        <button
                          key={c.id}
                          type="button"
                          onClick={() => setProfileFormColor(c.id)}
                          className={`p-2 rounded-xl border flex items-center gap-1 transition-all ${profileFormColor === c.id ? 'border-white bg-slate-800 scale-105' : 'border-slate-800 bg-slate-950'} cursor-pointer`}
                        >
                          <span className={`w-3.5 h-3.5 rounded-full ${c.bg}`}></span>
                          <span className="text-xs text-slate-400 font-semibold">{c.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsCreatingProfile(false)}
                      className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 rounded-xl font-bold transition-all focus:outline-none border-none cursor-pointer min-h-[44px]"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/10 focus:outline-none border-none cursor-pointer min-h-[44px]"
                    >
                      Salvar Perfil
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDITAR PERFIL */}
          {isEditingProfile && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl relative text-left">
                <h3 className="text-xl md:text-2xl font-bold text-white mb-6">Editar Perfil</h3>
                <form onSubmit={handleEditProfile} className="space-y-6">
                  <div>
                    <label className="block text-sm font-semibold text-slate-300 mb-2">Nome do Estudante</label>
                    <input 
                      type="text" 
                      required 
                      maxLength={15}
                      placeholder="Ex: Pedro"
                      value={profileFormName}
                      onChange={e => setProfileFormName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-semibold min-h-[44px]"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-300 mb-2">Escolha seu Avatar</label>
                    <div className="grid grid-cols-6 gap-2">
                      {AVATAR_OPTIONS.map(a => (
                        <button
                          key={a}
                          type="button"
                          onClick={() => setProfileFormAvatar(a)}
                          className={`p-2 rounded-lg transition-all flex items-center justify-center overflow-hidden h-12 ${profileFormAvatar === a ? 'bg-[#223b31]' : 'bg-slate-950 border border-slate-800/60'} cursor-pointer`}
                        >
                          {renderAvatar(a, "text-xl")}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-300 mb-2">Sua Cor de Identificação</label>
                    <div className="grid grid-cols-4 gap-2">
                      {MARKER_COLORS.map(c => (
                        <button
                          key={c.id}
                          type="button"
                          onClick={() => setProfileFormColor(c.id)}
                          className={`p-2 rounded-xl border flex items-center gap-1 transition-all ${profileFormColor === c.id ? 'border-white bg-slate-800 scale-105' : 'border-slate-800 bg-slate-950'} cursor-pointer`}
                        >
                          <span className={`w-3.5 h-3.5 rounded-full ${c.bg}`}></span>
                          <span className="text-xs text-slate-400 font-semibold">{c.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsEditingProfile(false)}
                      className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 rounded-xl font-bold transition-all focus:outline-none border-none cursor-pointer min-h-[44px]"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/10 focus:outline-none border-none cursor-pointer min-h-[44px]"
                    >
                      Salvar Alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIRMAÇÃO */}
          {confirmModal && (
            <div className="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-left">
                <div>
                  <h3 className="text-base md:text-lg font-bold text-white mb-2">{confirmModal.title}</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">{confirmModal.message}</p>
                </div>
                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setConfirmModal(null)}
                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl text-xs font-bold transition-all focus:outline-none border-none cursor-pointer min-h-[40px]"
                  >
                    Não, Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={confirmModal.onConfirm}
                    className="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-rose-500/10 border-none cursor-pointer min-h-[40px]"
                  >
                    Sim, Confirmar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- STREAMING_CHUNK: Bootstrapping e Montagem da Aplicação... ---
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
